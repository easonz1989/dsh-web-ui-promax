# dsh-web-ui-promax is an external bundle. It discovers every model declared
# by the generic local-provider adapter, augments their capabilities through
# Harness's public settings seam, and contributes browser controls through
# official slots; no Harness source patch.

- insert:
    - id: web-ui-promax
      name: 'dsh-web-ui-promax'
      config:
        defaultEffort: high
